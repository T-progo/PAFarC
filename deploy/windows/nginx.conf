# PharmaTech — Nginx reverse proxy (Windows VPS).
# Public: port 80 only. Everything goes to Streamlit on 127.0.0.1:8501.
# FastAPI (127.0.0.1:8000) is intentionally NOT proxied: only Streamlit talks to it.

worker_processes  1;
error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;

    # The app has no file uploads; requests are small form/JSON posts.
    client_max_body_size 2m;

    access_log  logs/access.log;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       80 default_server;
        server_name  _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;

        # Never serve dotfiles (e.g. .env) even if a static root is added later.
        location ~ /\. {
            deny all;
            return 404;
        }

        location / {
            proxy_pass http://127.0.0.1:8501;
            proxy_http_version 1.1;

            # Streamlit uses a long-lived WebSocket (/_stcore/stream).
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Keep idle sessions open (a pharmacist may type SOAP for a long time).
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }
    }
}
